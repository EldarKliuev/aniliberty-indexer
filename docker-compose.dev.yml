services:
  aniliberty-indexer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: aniliberty-indexer:dev
    container_name: aniliberty-indexer-dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORT:-3649}:${PORT:-3649}"
    volumes:
      - ./data:/app/data
